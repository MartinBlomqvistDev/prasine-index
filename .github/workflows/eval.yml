# Prasine Index: Golden Dataset Eval
#
# Runs the golden eval against the full pipeline as a regression check: a
# failure means verdicts have moved since the last run. It does not measure
# accuracy, because the expected verdicts were adjusted during development.
#
# Requires:
#   - ANTHROPIC_API_KEY secret set in the repository
#   - A PostgreSQL + pgvector instance (provided by the service container)
#
# Triggers:
#   - Manually via workflow_dispatch, with the 5-case quick subset or all 20 cases
#   - When a release is published (all 20 cases)
#
# A full run costs a few dollars of API usage, so the eval does not run on every
# push. The job fails if the API key is missing or the pass rate drops below 80%
# (exit code 1 from golden_dataset.py).

name: Eval

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "quick (5 cases) or full (20 cases)"
        type: choice
        options: [quick, full]
        default: quick
  release:
    types: [published]

jobs:

  golden-eval:
    name: Golden Dataset Eval
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: prasine
          POSTGRES_PASSWORD: prasine
          POSTGRES_DB: prasine_index_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for API key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY secret not set, the eval cannot run"
            exit 1
          fi

      - name: Initialise test database
        env:
          DATABASE_URL: postgresql+asyncpg://prasine:prasine@localhost:5432/prasine_index_test
        run: python -c "import asyncio; from core.database import init_db; asyncio.run(init_db())"

      - name: Run golden dataset eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: postgresql+asyncpg://prasine:prasine@localhost:5432/prasine_index_test
          TESTING: "true"
          LOG_LEVEL: "WARNING"
          SCOPE_FLAG: ${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'quick' && '--quick' || '' }}
        run: python -m eval.golden_dataset $SCOPE_FLAG
